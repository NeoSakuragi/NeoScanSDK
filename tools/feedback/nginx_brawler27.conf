# brawler27.duckdns.org (Bruno 2026-10-16): the shareable Brawler address. ONLY the tester download page
# (/brawler/get/, behind the Oros sign-in, brawler testers + admins) and the two Oros calls its login needs.
# Everything else (kanji, Oros, Lab, ...) stays on canneji.duckdns.org only: 404 here.
server {
    server_name brawler27.duckdns.org;
    location = / { return 302 /brawler/get/; }
    location = /brawler-player-auth {
        internal;
        proxy_pass http://127.0.0.1:8900/api/authcheck?tag=brawler_tester,brawler_admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location = /brawler/get { return 301 /brawler/get/; }
    location = /brawler/get/login.html { alias /data/brawler/get/login.html; add_header Cache-Control "no-cache" always; }
    location ^~ /brawler/get/ {
        auth_request /brawler-player-auth;
        error_page 401 = @brawlerget_login;
        alias /data/brawler/get/;
        add_header Cache-Control "no-cache" always;
        types { text/html html; application/vnd.android.package-archive apk; }
    }
    location @brawlerget_login { return 302 /brawler/get/login.html; }
    location ~ ^/oros/api/(login|whoami)$ {
        proxy_pass http://127.0.0.1:8900/api/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { return 404; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brawler27.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brawler27.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = brawler27.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name brawler27.duckdns.org;
    return 404; # managed by Certbot


}