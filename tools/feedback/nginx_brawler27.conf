# brawler27.duckdns.org (Bruno 2026-10-16): the shareable Brawler address. ONLY the tester download page
# (/brawler/get/, behind the Oros sign-in, brawler testers + admins) and the two Oros calls its login needs.
# Everything else (kanji, Oros, Lab, ...) stays on canneji.duckdns.org only: 404 here.
server {
    server_name brawler27.duckdns.org;
    # public (Bruno 2026-10-16: no sign-in on this address, just the page and the APK; the app itself asks for the sign-in)
    location = / { root /data/brawler/get; try_files /index.html =404; add_header Cache-Control "no-cache" always; }
    location ~ ^/(brawler-[0-9.]+\.apk)$ { alias /data/brawler/get/$1; types { } default_type application/vnd.android.package-archive; add_header Cache-Control "no-cache" always; }
    location / { return 404; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brawler27.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brawler27.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = brawler27.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name brawler27.duckdns.org;
    return 404; # managed by Certbot


}