<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fighter Review</title>
<!-- The old URL (review.html?f=X[&q=<set>], or #f=X): the Fighter Lab's Review tab is the one template now (lab.html +
     fighterlab.js load review.js; Bruno 2026-10-10). Without a fighter: the first of the review index, as before.
     review.html?q=throws: the THROW REVIEW (note 20261016-045300-e03d round 2), a page of its own: review.js's throw mode
     in #rev here (no fighter: every throw of the beta's playable fighters; data tools/brawler/throw_review.py).
     review.html?q=throws2: round 2 (impact / launch / held as separate events; data throw_review.py --set throws2).
     review.html?q=bossthrows: THE BOSS THROWS (2026-10-17), the same page on the bosses' throws on Terry (data
     throw_review.py --set bossthrows, answers throw_answers.py apply2 GAME --boss). -->
<script>
(function () {
  var q = new URLSearchParams(location.search), m = /^#f=(\w+)/.exec(location.hash);
  if (q.get('q') === 'throws' || q.get('q') === 'throws2' || q.get('q') === 'bossthrows') {
    document.title = { throws2: 'Throw Review 2', bossthrows: 'Boss Throws' }[q.get('q')] || 'Throw Review';
    document.addEventListener('DOMContentLoaded', function () {
      ['micnote.js', 'review.js'].reduce(function (p, src) {
        return p.then(function () { return new Promise(function (ok) { var s = document.createElement('script'); s.src = src; s.onload = s.onerror = ok; document.body.append(s); }); });
      }, Promise.resolve());
    });
    return;
  }
  if (!q.get('f') && m) q.set('f', m[1]);
  q.set('tab', 'review');
  if (q.get('f')) { location.replace('lab.html?' + q.toString()); return; }
  fetch('review/index.json', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
    q.set('f', j.fighters[0].fighter); location.replace('lab.html?' + q.toString());
  }, function () { location.replace('lab.html'); });
})();
</script>
</head>
<body style="background:#fff;color:#000;font:17px system-ui,sans-serif;padding:16px;margin:0">
<main id="rev"><p>Loading…</p></main>
</body>
</html>
