<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeoCart PCB Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; color: #e0e0e0; font-family: 'SF Mono', 'Fira Code', monospace; }
header { padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a4a; }
header h1 { font-size: 18px; font-weight: 600; color: #f0e68c; }
#status { font-size: 12px; color: #888; }
#status.live { color: #4ecdc4; }
.section { border-bottom: 1px solid #2a2a4a; }
.section h2 { padding: 8px 24px; font-size: 14px; color: #aaa; background: #0e0e22; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; }
.panel { position: relative; background: #12122a; overflow: hidden; }
.panel img { width: 100%; height: 100%; object-fit: contain; }
.panel .label { position: absolute; top: 6px; left: 10px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 3px; }
.panel .label.front { background: #c0392b; color: white; }
.panel .label.back { background: #2980b9; color: white; }
</style>
</head>
<body>
<header>
  <h1>NeoCart PCB Viewer — PROG + CHA</h1>
  <span id="status">connecting...</span>
</header>
<div class="section">
  <h2>PROG Board (CTRG2)</h2>
  <div class="grid">
    <div class="panel"><span class="label front">PROG A-Side (Front)</span><img id="img0" alt="PROG front"></div>
    <div class="panel"><span class="label back">PROG B-Side (Back)</span><img id="img1" alt="PROG back"></div>
  </div>
</div>
<div class="section">
  <h2>CHA Board (CTRG1)</h2>
  <div class="grid">
    <div class="panel"><span class="label front">CHA A-Side (Front)</span><img id="img2" alt="CHA front"></div>
    <div class="panel"><span class="label back">CHA B-Side (Back)</span><img id="img3" alt="CHA back"></div>
  </div>
</div>
<script>
const IMAGES = [
  { id: 'img0', src: 'prog_front.png' },
  { id: 'img1', src: 'prog_back.png' },
  { id: 'img2', src: 'cha_front.png' },
  { id: 'img3', src: 'cha_back.png' },
];
const INTERVAL = 2500;
let tick = 0;

function refresh() {
  const bust = Date.now();
  IMAGES.forEach(({ id, src }) => {
    const img = document.getElementById(id);
    const url = src + '?v=' + bust;
    const probe = new Image();
    probe.onload = () => { img.src = url; };
    probe.onerror = () => {};
    probe.src = url;
  });
  tick++;
  const el = document.getElementById('status');
  el.textContent = 'live • refresh #' + tick;
  el.className = 'live';
}

refresh();
setInterval(refresh, INTERVAL);
</script>
</body>
</html>
