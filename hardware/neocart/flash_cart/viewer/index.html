<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeoCart PCB Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; color: #e0e0e0; font-family: 'SF Mono', 'Fira Code', monospace; }
header { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a4a; }
header h1 { font-size: 18px; font-weight: 600; color: #f0e68c; }
#status { font-size: 12px; color: #888; }
#status.live { color: #4ecdc4; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; height: calc(100vh - 53px); }
.panel { position: relative; background: #12122a; overflow: hidden; }
.panel img { width: 100%; height: 100%; object-fit: contain; }
.panel .label { position: absolute; top: 8px; left: 12px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 3px; }
.panel .label.front { background: #c0392b; color: white; }
.panel .label.back { background: #2980b9; color: white; }
.panel .label.front-silk { background: #f39c12; color: #111; }
.panel .label.back-silk { background: #27ae60; color: white; }
</style>
</head>
<body>
<header>
  <h1>NeoCart PCB Viewer</h1>
  <span id="status">connecting...</span>
</header>
<div class="grid">
  <div class="panel"><span class="label front">F.Cu + Mask</span><img id="img0" alt="Front copper"></div>
  <div class="panel"><span class="label back">B.Cu + Mask</span><img id="img1" alt="Back copper"></div>
  <div class="panel"><span class="label front-silk">F.Cu + Silk</span><img id="img2" alt="Front silk"></div>
  <div class="panel"><span class="label back-silk">B.Cu + Silk</span><img id="img3" alt="Back silk"></div>
</div>
<script>
const IMAGES = [
  { id: 'img0', src: 'front_cu.png' },
  { id: 'img1', src: 'back_cu.png' },
  { id: 'img2', src: 'front_silk.png' },
  { id: 'img3', src: 'back_silk.png' },
];
const INTERVAL = 2500;
let tick = 0;

function refresh() {
  const bust = Date.now();
  IMAGES.forEach(({ id, src }) => {
    const img = document.getElementById(id);
    const url = src + '?v=' + bust;
    const probe = new Image();
    probe.onload = () => { img.src = url; };
    probe.onerror = () => {};
    probe.src = url;
  });
  tick++;
  const el = document.getElementById('status');
  el.textContent = 'live • refresh #' + tick;
  el.className = 'live';
}

refresh();
setInterval(refresh, INTERVAL);
</script>
</body>
</html>
